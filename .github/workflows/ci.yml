name: ci

# The third external review's "High: Add CI and protected pull-request gates".
#
# Every job here corresponds to something a review had to run BY HAND to find a
# defect. The point of the file is that nobody has to run them by hand again:
#   - the hostile suite is the reproduction of eleven defects found by reading;
#   - the fuzz smoke test is a small version of the 50,000-case run that found
#     six exception classes;
#   - the content job is the one that catches a renamed check ID, which Sigma
#     validation alone cannot;
#   - the perf job is the one that catches an amplification regression, which is
#     an availability fault and would otherwise only show up in production.
#
# Branch protection is a repository setting and cannot be committed. Require
# these checks on the default branch in Settings -> Branches.
#
# ACTIONS ARE PINNED TO COMMIT SHAs, not to tags. A tag is a mutable pointer in
# a repository this project does not control: whoever can move `v4` can run
# arbitrary code in a job that holds this repository's token, and the diff that
# does it is invisible here because the workflow file does not change. Pinning
# to a SHA makes the supply chain a content address rather than a name lookup.
#
# The version comment after each SHA is the human-readable half and is checked
# by tests/test_ci_config.py, along with the pinning itself, so an unpinned
# `uses:` added later fails the suite rather than being noticed by a reviewer.
#
# The cost of pinning is that security updates stop arriving on their own.
# .github/dependabot.yml is the other half of the trade: it opens a pull request
# when a pinned action moves, which puts the update through the same review and
# the same required checks as any other change.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject. Test the floor, or the floor
        # is a claim rather than a fact.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Runtime dependency check
        run: |
          # Zero runtime dependencies is a design commitment, not an accident.
          # It is what lets Cohaera run on a locked-down collector VM and in an
          # air-gapped lab. Assert it rather than hoping.
          #
          # Read from the INSTALLED distribution metadata, not from pyproject.
          # Two reasons, and the second one is why this step exists at all:
          #
          #   1. tomllib is Python 3.11+. Parsing pyproject.toml made this step
          #      fail on 3.10 -- the floor this matrix tests precisely BECAUSE it
          #      is the floor. A check that cannot run on the oldest supported
          #      interpreter is not a check.
          #   2. pyproject is a claim; the metadata is the outcome. A dependency
          #      that arrives by any other route (a build hook, a vendored
          #      setup.py, a plugin) is invisible to a pyproject parse and caught
          #      here.
          #
          # importlib.metadata is 3.8+, so this runs everywhere in the matrix.
          python - <<'PY'
          import importlib.metadata as md
          reqs = md.requires("cohaera") or []
          runtime = [r for r in reqs if "extra ==" not in r]
          assert not runtime, f"runtime dependencies appeared: {runtime}"
          print(f"runtime dependencies: 0 ({len(reqs)} optional, all extras)")
          PY
      - name: Lint
        run: |
          # Print the version. The rule set is pinned in pyproject's
          # [tool.ruff.lint] select, so a version bump can no longer silently
          # change what this gate means -- but when something does drift, the
          # first question is always "which ruff", and it should not take a
          # re-run to answer it.
          ruff --version
          ruff check src tests
      - name: Type check
        run: |
          # COH-R15. The review raised this as unverified because mypy was not
          # installed anywhere; it is a gate now. The configuration lives in
          # pyproject's [tool.mypy], including the two flags that are switched
          # off and why, for the same reason the ruff selection does.
          #
          # src only. The test suite constructs deliberately ill-typed values
          # by the hundred -- that is what tests/test_hostile.py IS -- and type
          # checking it would mean annotating hostile input as hostile, which
          # proves nothing about the shipped package.
          mypy --version
          mypy
      - name: Unit and hostile tests
        run: python -m pytest tests/ -q
      - name: Adversarial self-test
        run: |
          # Passes when the catalogued evasions still work. A FAILURE here means
          # somebody closed a known weakness without updating EVASION.md, which
          # is the one outcome this suite exists to make noisy.
          python tests/test_evasion.py

  fuzz:
    name: malformed-input fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Fuzz smoke test
        run: python tests/fuzz_smoke.py 4000

  content:
    name: sigma validation and conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,content]"
      - name: Sigma rule validation
        run: sigma check content/sigma/
      - name: Sigma converts to a real backend
        run: |
          # Validation proves the YAML is well-formed. Conversion proves a
          # backend can turn it into a query. Neither proves the query matches
          # anything, which is what the conformance suite below is for.
          sigma plugin install splunk
          sigma convert -t splunk --without-pipeline content/sigma/
      - name: Content conformance
        run: python -m pytest tests/test_content.py -q

      - name: Evaluation corpus regenerates and the card is current
        # The corpus is deterministic from its seed and is NOT committed, so the
        # thing to guard is that it still generates, still passes its own
        # label-integrity checks, and still produces the committed evaluation
        # card byte for byte. A card that no longer matches the detector it
        # claims to describe is worse than no card.
        run: |
          python eval/vocabulary.py
          python eval/run_eval.py
          git diff --exit-code -- eval/EVALUATION-CARD.md eval/evaluation-card.json \
                                  eval/corpus/sample.jsonl eval/corpus/sample.labels.jsonl

      - name: README claims match the repository
        # C4-11. The README said "188 passing" against a tree with 197 and
        # listed one roadmap item twice. A number nothing keeps true is the one
        # kind of defect this project cannot ship, so the counts are derived
        # from the tree and checked here. Named as its own step, inside an
        # existing job, so the ruleset's nine required checks stay nine --
        # see tests/test_ci_config.py.
        run: python tools/readme_facts.py --check

  perf:
    name: amplification regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Resource bounds
        run: |
          python -m pytest tests/test_hostile.py -q -k \
            "amplify or linear or quadratic or bounded"

  build:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate fixtures
        # tests/fixtures/*.jsonl is gitignored: it is generated output, and a
        # generator checked in alongside its output drifts from it silently.
        run: python tests/make_fixtures.py
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          # If this pulls anything in, the zero-dependency claim is broken.
          /tmp/verify/bin/pip list --format=freeze | tee /tmp/installed.txt
          /tmp/verify/bin/cohaera score tests/fixtures/suspect.jsonl \
            --baseline tests/fixtures/benign.jsonl > /tmp/verdicts.jsonl
          python - <<'PY'
          import json, pathlib
          rows = [json.loads(x) for x in
                  pathlib.Path("/tmp/verdicts.jsonl").read_text().splitlines() if x]
          assert len(rows) == 4, rows
          assert all(r["type"] == "cohaera_session_verdict" for r in rows)
          assert all(r["verdict_id"] for r in rows)
          print(f"{len(rows)} verdict record(s) emitted from the installed wheel")
          PY
      - name: The installed package carries its PEP 561 marker
        run: |
          # COH-R15. Checked on the INSTALLED package rather than in the source
          # tree, because the failure this guards against is a packaging one:
          # `py.typed` present in src/ and missing from the wheel means every
          # downstream type checker silently treats `import cohaera` as Any,
          # and nothing in the repository looks wrong.
          /tmp/verify/bin/python - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.find_spec("cohaera")
          root = pathlib.Path(spec.origin).parent
          marker = root / "py.typed"
          assert marker.is_file(), (
              f"py.typed is not in the installed package at {root}; the "
              "annotations ship but no downstream checker will read them")
          print(f"PEP 561 marker present at {marker}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate an SBOM for the built artefact
        run: |
          # COH-R17. This step used to be `cyclonedx-py environment` against the
          # runner's own interpreter, after pip-installing the wheel into it. The
          # step was named "for the built artefact" and produced an SBOM of the
          # BUILD ENVIRONMENT: pip, build, cyclonedx-bom, setuptools, wheel and
          # their transitive closure, plus whatever the GitHub image ships. Run
          # here that command emits 94 components and cohaera is not the subject
          # of any of them. Shipping it as this project's SBOM would be a
          # supply-chain document describing a machine nobody receives.
          #
          # The artefact's dependency closure is what installing the WHEEL pulls
          # in, so that is what gets built and described: an empty virtualenv,
          # the wheel installed into it, and the SBOM taken of that. --pyproject
          # supplies the root component's own metadata, so the document says it
          # describes cohaera rather than leaving the subject unnamed.
          python -m pip install --upgrade pip build cyclonedx-bom
          python -m build
          python -m venv --without-pip /tmp/sbom-venv
          SITE=$(/tmp/sbom-venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          # No --no-deps: a runtime dependency added later MUST appear here.
          python -m pip install --target "$SITE" dist/*.whl
          cyclonedx-py environment /tmp/sbom-venv \
            --pyproject pyproject.toml \
            -o /tmp/cohaera-sbom.json
      - name: The SBOM describes the wheel, and the wheel has no dependencies
        run: |
          # Two assertions, because the old step could not have failed and an
          # SBOM nothing checks is an artefact rather than a control.
          #
          # The first is about this job: if the document's subject is not
          # cohaera then it is describing something else again, whatever it
          # happens to contain. The second re-derives the zero-dependency claim
          # from the installed CLOSURE rather than from the distribution
          # metadata the tests job reads -- same commitment, independent route,
          # and this one would catch a dependency that arrives without ever
          # appearing in cohaera's own metadata.
          python - <<'PY'
          import json
          sbom = json.load(open("/tmp/cohaera-sbom.json"))
          root = sbom.get("metadata", {}).get("component", {})
          assert root.get("name") == "cohaera", (
              f"the SBOM describes {root.get('name')!r}, not the wheel")
          components = [c["name"] for c in sbom.get("components", [])]
          assert not components, (
              f"installing the wheel pulled in {components}; the runtime is "
              "supposed to have zero dependencies")
          print(f"SBOM subject: cohaera {root.get('version')}, 0 components")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: /tmp/cohaera-sbom.json
