name: codeql

# Static analysis, added because four external reviews found defects by reading
# the code and none of them were found by anything automated.
#
# Be clear about what this is and is not. CodeQL's Python queries find injection
# sinks, unsafe deserialisation, path traversal and a long tail of API misuse.
# Not one of the twenty-two defects the reviews found -- a budget checked after
# the work it bounds, a cache keyed on a length, `bool("false")`, a bigram model
# applied outside its distribution -- is a shape CodeQL recognises. Those are
# semantic faults in a security control, and the honest expectation is that this
# job is quiet forever.
#
# It is here anyway, for the class it DOES cover: the ordinary Python mistake
# somebody makes at 2am in a file nobody re-reads. A gate that catches a
# different class than your reviewers is worth having precisely because it
# catches a different class. It is not evidence that the reviews are covered.
#
# security-extended over the default suite: this is a security tool, and the
# extra queries' false positive rate is a cost worth paying in a repository
# whose entire argument is that a check which silently cannot run is worse than
# one that is noisy.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    # Weekly, so a query pack updated after the last commit still gets run
    # against this code. Monday 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # No `paths:` filter anywhere in this file, and no matrix in this job name.
    # Both are deliberate. This job is a REQUIRED status check: a required check
    # that is skipped does not report, and a check that does not report stays
    # pending forever, so every pull request is blocked with no error message
    # anywhere. tests/test_ci_config.py asserts the name here matches the name
    # in .github/rulesets/main.json for the same reason.
    name: codeql (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write     # to upload the SARIF result
      actions: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:python"
