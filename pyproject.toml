[build-system]
# Upper bounds as well as lower. SEC-09: an unpinned build requirement means the
# artefact you ship is a function of the day you built it, and "setuptools>=68"
# accepts every future major release sight unseen. Bounded here so a release is
# reproducible; raise the ceilings deliberately, not by accident.
requires = ["setuptools>=68,<81", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "cohaera"
version = "0.2.0"
description = "The correlation layer for agent telemetry. Turns observra's per-event stream into correlation-grade events a SIEM can fire rules on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Hafeez" }]
keywords = ["security", "siem", "detection-engineering", "ai-agents", "observability", "telemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]
# Deliberately zero runtime dependencies. It must run on a locked-down
# collector VM with no package install, and in an air-gapped lab.
dependencies = []

[project.optional-dependencies]
# Bounded for the same reason as the build requirements. PyYAML and sigma-cli
# are needed only by tests/test_content.py, which asserts that every field the
# Sigma pack references actually exists in an emitted verdict. Sigma validation
# alone proves a rule is well-formed, not that it can ever match.
dev = [
  "pytest>=8.0,<10",
  # COH-R15. Bounded like everything else here: a type checker whose rule set
  # moves underneath you is the same coin flip the ruff comment below
  # describes, and mypy's inference genuinely does change between minors.
  "mypy>=1.11,<3",
  # Floor raised to 0.15: the explicit lint select in [tool.ruff.lint]
  # names rules (RUF034, PLE2502) that older releases do not implement,
  # and ruff errors on an unknown rule code rather than skipping it.
  "ruff>=0.15,<1",
  "PyYAML>=6.0,<7",
]
content = ["sigma-cli>=3.1,<4"]

[project.scripts]
cohaera = "cohaera.cli:main"

[project.urls]
Repository = "https://github.com/404SecNotFound/Cohaera"

[tool.setuptools.packages.find]
where = ["src"]

# COH-R15. PEP 561: without this marker a type checker in a DOWNSTREAM project
# silently ignores every annotation in this package and treats `import cohaera`
# as returning Any. The annotations exist and are checked in CI; the marker is
# what makes them mean anything to anyone else.
[tool.setuptools.package-data]
cohaera = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

# The rule set is declared HERE, not inherited from whatever ruff's default
# happens to be on the day CI runs.
#
# This is a real failure this repo hit. `ruff>=0.6,<1` let CI resolve a version
# whose DEFAULT selection was broader than the one used locally, so `ruff check`
# passed on a developer machine and produced 43 findings in CI on identical
# source. A linter whose rule set changes underneath you is not a gate, it is a
# coin flip, and pinning the version alone only defers the problem to the next
# bump. Declaring the selection makes the check mean the same thing everywhere.
#
# It is the same class of defect the third security review raised as SEC-09
# about build requirements, found one layer up in the tooling that was supposed
# to enforce it.
[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax
  "F",               # pyflakes
  "I",               # isort
  "B",               # flake8-bugbear
  "UP",              # pyupgrade
  "RUF",             # ruff-specific
  "PLE", "PLW", "PLC",  # pylint errors, warnings, conventions
]
# PLR (refactor) is deliberately out: too-many-arguments and magic-value-comparison
# fire constantly on detection code where the magic values ARE the specification.

[tool.ruff.lint.per-file-ignores]
# The evasion suite documents weaknesses in prose that is the point of the file.
# Test files legitimately construct hostile literals.
"tests/*" = ["B011"]


# COH-R15. The type checker's configuration is declared here for the reason the
# ruff selection above is: a gate whose strictness depends on the version CI
# happens to resolve is not a gate.
#
# NOT --strict, and the reason is the schema firewall. `validate.py` exists to
# take producer-controlled JSON of any shape and hand back values of known
# type, so `Any` at its inputs is the design rather than laziness, and
# disallow_any_expr would fire on every correct line of it. What is switched on
# is the part that catches real defects in this codebase: a None reaching an
# operation that cannot take one, which is the shape of most of what external
# review has found here.
[tool.mypy]
python_version = "3.10"
files = ["src/cohaera"]
strict_optional = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Two flags are deliberately OFF, and both were tried before being switched off.
#
# warn_unreachable fires 16 times, every one of them on a defensive isinstance
# the schema firewall makes on purpose -- `isinstance(v, (list, tuple)) and not
# isinstance(v, (str, bytes))`, where mypy is correct that a list cannot also
# be a str and the guard is there because str IS a sequence and this code reads
# producer-controlled JSON. Satisfying the flag means deleting those guards,
# which is precisely the "reviewer who cannot see why a line is defensive will
# eventually simplify it away" failure CONTRIBUTING warns about. The flag would
# be a machine doing it.
#
# warn_unused_ignores is version-dependent across the range the dev extra
# allows. The `# type: ignore[assignment]` comments on FrozenDict's mutators
# are required by mypy 1.x and unnecessary by 2.3, so the flag fails on one end
# of the supported range and removing the ignores fails on the other. A gate
# whose result depends on which version resolved is the coin flip the ruff
# selection above exists to prevent.
