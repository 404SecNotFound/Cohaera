title: Agent Telemetry Failed Collector Integrity Verification
id: 3e9a1c7d-8b64-4f02-a5d1-7c2e40b9f8a3
status: experimental
custom:
    # DEPLOYMENT TIER. Sigma has no tier field and this pack will not put one in
    # `tags` -- see content/README.md, "How the tier is recorded, and why not as
    # a tag". `custom:` is pySigma's documented extension point: unrecognised
    # top-level keys land in SigmaRule.custom_attributes and `sigma check`
    # passes them through with 0 errors and 0 issues.
    #
    # production  deployable, may page. Zero benign hits on the evaluation card.
    # hunt        never an alert. Investigation surface only.
    # dashboard   a configuration state, not an event. Alert on a CHANGE in it.
    deployment_tier: production
    tier_rationale: >-
        CH06 fires on 56 of its own labelled attacks and on 0 benign sessions,
        including 24 out-of-order-delivery sessions and 72 straddling a
        collector key rotation -- the two benign shapes that would have made it
        unusable. Conditional on a capability manifest; see the name_only caveat
        in content/README.md.
    # Ownership and review. `author` records who wrote it; `owner` records who
    # answers for it now, and mirrors .github/CODEOWNERS. An unowned rule is a
    # stale rule within two quarters.
    owner: '@404SecNotFound'
    last_reviewed: 2026-08-19
    review_cadence_days: 90
    next_review: 2026-11-17
    # The tier is bound to a measurement, not to an opinion.
    # tests/test_content.py re-reads these five values out of the card on every
    # test run and fails if a rule and the evidence disagree.
    evidence:
        source: eval/evaluation-card.json
        card_cell: 'unseen|task_disjoint|manifest'
        check: CH06_evidence_integrity
        labelled: 56
        on_target_attacks: 56
        on_benign: 0
        target_precision_pct: 100.0
description: |
  Records in this agent session did not verify against what the collector
  attested to: a gap in the collector's sequence, a record that does not match
  the hash chain, a signature that did not verify, or a record signed by a key
  the operator did not supply.

  THIS IS NOT A BEHAVIOURAL FINDING AND SHOULD NOT BE TRIAGED AS ONE. Every
  other rule in this pack is a statement about what an agent did. This one is a
  statement about whether the evidence for any of those is admissible. A session
  that fires this rule has findings -- and absences of findings -- that rest on
  records somebody could have edited.

  Read it with data.findings[].evidence_status on the OTHER findings in the same
  verdict, which is one of:

    verified_complete  the chain held and a signature verified against a
                   supplied key THROUGH THE FINAL ACCEPTED RECORD
    verified_prefix  a signature verified, and the records after the highest
                   verified sequence are not covered by it. A signature over a
                   chain head anchors the prefix up to that head and says
                   nothing about an unsigned tail, which can be replaced and
                   re-chained. evidence.integrity.verified_through carries how
                   far it reached
    chained_unsigned  the chain held; nothing was supplied to verify its origin
    unattested     no integrity evidence at all. THE DEFAULT for any deployment
                   that has not adopted cohaera.integrity:1, and it means
                   tampering was not ruled out rather than ruled out
    inadmissible   this rule fired

  WHAT IT CANNOT TELL YOU. Not who did it. A collector holding the signing key
  can produce a perfectly chained stream of lies, and where the adapter runs
  in-process with the agent that is not even a compromise, it is the normal
  configuration. Verification says these records are the ones that collector
  wrote. It does not say the collector was truthful.

  STREAM REPLAY AND STREAM FORK ARE THE TWO THAT NEED A LEDGER.
  data.findings[].evidence.integrity.codes distinguishes them, and they mean
  different things:

    INTEGRITY_STREAM_REPLAYED  a stream this Cohaera host already scored was fed
                               again, and the chain head matches at the shared
                               sequence -- the same records, twice. Every other
                               check in this pack passes on it, because the
                               records are genuine; they are just not new.
    INTEGRITY_STREAM_FORKED    the same sequence positions carry DIFFERENT
                               records, both validly signed. Somebody holding a
                               collector key produced two mutually exclusive
                               versions of one stream. Escalate this above a
                               replay: it is not a duplicate, it is a rewrite.

  Both require `--seen-streams`. Without it the verdict carries
  NO_STREAM_LEDGER and neither can fire, so their absence is not evidence of
  absence. The ledger is unsigned local state by necessity and an attacker who
  can delete it defeats it (EVASION.md E22).

  A SEQUENCE GAP IS THE ONE TO ESCALATE. Deleting an event was, before this,
  detectable only by accident -- when the missing call happened to break a
  learned bigram. data.findings[].evidence.integrity.sequence_gaps says how many
  records are missing and where, and Cohaera distinguishes a genuine deletion
  from out-of-order delivery: reordered records are counted separately under
  records_reordered and do not fire this rule.

  Requires Cohaera and a collector emitting cohaera.integrity:1.
references:
    - https://github.com/404SecNotFound/Cohaera
    - https://github.com/404SecNotFound/Cohaera/blob/main/docs/EVIDENCE-TRUST.md
    - https://genai.owasp.org/llm-top-10/
author: Imran Hafeez
date: 2026-08-07
modified: 2026-08-07
logsource:
    product: cohaera
    service: session_verdict
detection:
    selection:
        type: 'cohaera_session_verdict'
        data.triggered_rules|contains: 'CH06_evidence_integrity'
    condition: selection
fields:
    - session_id
    - agent_name
    - user
    - host
    - data.tool_sequence
    - data.coverage.completeness
falsepositives:
    - A collector restart that resets a stream's sequence without a new
      stream_id. Fix the collector; a sequence that restarts is a sequence that
      cannot detect deletion.
    - Delivery reordering beyond Cohaera's reorder window, which is bounded at
      max_reorder_window records. Check
      data.findings[].evidence.integrity.codes for
      INTEGRITY_REORDER_BUDGET_EXHAUSTED, which says the gap call was forced by
      that bound rather than concluded from the evidence.
level: critical
