title: Agent Tool-Call Ordering Deviates From Its Learned Baseline
id: e62a1854-70ed-491d-b7e1-2fa6833b4502
status: experimental
custom:
    # DEPLOYMENT TIER. Sigma has no tier field and this pack will not put one in
    # `tags` -- see content/README.md, "How the tier is recorded, and why not as
    # a tag". `custom:` is pySigma's documented extension point: unrecognised
    # top-level keys land in SigmaRule.custom_attributes and `sigma check`
    # passes them through with 0 errors and 0 issues.
    #
    # production  deployable, may page. Zero benign hits on the evaluation card.
    # hunt        never an alert. Investigation surface only.
    # dashboard   a configuration state, not an event. Alert on a CHANGE in it.
    deployment_tier: hunt
    tier_rationale: >-
        35.3% target precision and 60 benign hits. Roughly two alerts in three
        would be a legitimate but rare ordering. That is a hunting input over a
        long window, not a page, and the rule's own falsepositives block says
        which trigger to triage on.
    # Ownership and review. `author` records who wrote it; `owner` records who
    # answers for it now, and mirrors .github/CODEOWNERS. An unowned rule is a
    # stale rule within two quarters.
    owner: '@404SecNotFound'
    last_reviewed: 2026-08-19
    review_cadence_days: 90
    next_review: 2026-11-17
    # The tier is bound to a measurement, not to an opinion.
    # tests/test_content.py re-reads these five values out of the card on every
    # test run and fails if a rule and the evidence disagree.
    evidence:
        source: eval/evaluation-card.json
        card_cell: 'unseen|task_disjoint|manifest'
        check: CH01_sequence_order
        labelled: 72
        on_target_attacks: 72
        on_benign: 60
        target_precision_pct: 35.3
description: |
  The tool-call ordering in this session contains transitions never observed in
  the benign baseline corpus for this agent, above the configured violation
  rate threshold.

  Severity is raised when the session used a tool that appears in no benign
  session at all, which is a first-time-action signal rather than a
  reordering signal.

  The two-axis split (order violation vs semantic drift) is borrowed from
  TraceAegis (arXiv:2510.11203). This rule implements the order axis.

  Contrast with observra's own detect_suspicious_sequence(), which tests
  has_read AND has_external over the whole session. That is set membership with
  no notion of order, and as of v1.1.0 it is dead code that nothing calls, so
  the "Suspicious Tool Sequence" rule it feeds can never fire.
references:
    - https://github.com/404SecNotFound/Cohaera
    - https://arxiv.org/abs/2510.11203
    - https://www.exabeam.com/blog/security-operations-center/what-makes-agent-activity-harder-to-detect/
author: Imran Hafeez
date: 2026-08-07
# Tags intentionally omitted. Sigma validation rejects private namespaces
# (owasp.*, cohaera.*) and MITRE ATLAS IDs were not verified against the
# current matrix. Add them in your own pipeline if it accepts them.
logsource:
    product: cohaera
    service: session_verdict
detection:
    selection:
        type: 'cohaera_session_verdict'
        data.triggered_rules|contains: 'CH01_sequence_order'
    condition: selection
fields:
    - session_id
    - agent_name
    - data.tool_sequence
    - data.distinct_tools
    - data.findings
falsepositives:
    - |
      HIGH IF THE BASELINE IS THIN. A grammar fitted on a small or homogeneous
      corpus learns few transitions and will flag anything novel. Fit on real
      variety and record baseline_sessions in the finding evidence so an analyst
      can judge how much to trust it.
    - Legitimate new capability. A newly added tool is novel by definition.
      Re-fit the baseline after any deliberate change to the agent.
    - Agents with genuinely non-deterministic planning, where ordering varies
      run to run without security significance.
    - |
      A LEGITIMATE RARE ACTION IN A LONG SESSION. Read
      findings[].evidence.triggers first. 'rate' means the session's whole shape
      is unusual. 'unseen_consequential' means the shape is ORDINARY and one
      novel route into a state-changing or egress call is what fired it -- which
      is the only thing that catches a diluted attack (EVASION.md E02) and also
      fires on an agent taking one of its own rare secondary actions. Measured
      at 32 true to 16 false on the evaluation corpus. Triage that trigger on
      the DESTINATION tool in evidence.unseen_consequential_transitions, not on
      the violation rate, which will be low by definition.
level: medium
